<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="btnGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="420" height="780" fill="#f1f5f9"/>

  <!-- Option Title Header -->
  <text x="210" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#be123c" text-anchor="middle" letter-spacing="1">OPTION 2</text>
  <text x="210" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">3-Pillar Visual App Card (Zero Clutter)</text>

  <!-- Phone Mockup Body -->
  <rect x="22" y="70" width="376" height="690" rx="36" fill="#ffffff" stroke="#1e293b" stroke-width="8" filter="url(#shadow2)"/>

  <!-- Phone Speaker Notch -->
  <rect x="150" y="74" width="120" height="16" rx="8" fill="#1e293b"/>
  <circle cx="170" cy="82" r="3" fill="#334155"/>
  <rect x="185" y="80" width="50" height="4" rx="2" fill="#334155"/>

  <!-- Top Announcement Bar -->
  <rect x="26" y="98" width="368" height="24" fill="#0f172a"/>
  <text x="38" y="114" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24">ESTD. 1984</text>
  <text x="382" y="114" font-family="sans-serif" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="end">Helpline: 9512592211</text>

  <!-- Mobile Header Navbar -->
  <rect x="26" y="122" width="368" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="145" r="14" fill="#fee2e2"/>
  <text x="50" y="150" font-family="sans-serif" font-size="13" font-weight="900" fill="#be123c" text-anchor="middle">V</text>
  <text x="72" y="141" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">VASANTHA GROUP</text>
  <text x="72" y="153" font-family="sans-serif" font-size="9" font-weight="600" fill="#be123c">Faculty of Health Sciences</text>
  <rect x="306" y="134" width="46" height="22" rx="11" fill="#be123c"/>
  <text x="329" y="149" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Apply</text>
  <text x="370" y="150" font-family="sans-serif" font-size="16" font-weight="700" fill="#334155">☰</text>

  <!-- Content Area -->
  <g transform="translate(38, 185)">
    <!-- ==================== OPTION 2 3-PILLAR CARD ==================== -->
    <rect x="0" y="0" width="344" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Category Tag -->
    <text x="14" y="24" font-family="sans-serif" font-size="9" font-weight="800" fill="#be123c" letter-spacing="0.5">AFFORDABLE EDUCATION &amp; SOCIAL COMMITMENT</text>
    
    <!-- Title -->
    <text x="14" y="46" font-family="sans-serif" font-size="14" font-weight="900" fill="#0f172a">Education for Everyone.</text>
    <text x="14" y="63" font-family="sans-serif" font-size="14" font-weight="900" fill="#be123c">Your Dreams Deserve a Chance.</text>
    <text x="14" y="80" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#64748b">Empowering students from SC/ST, rural &amp; tribal backgrounds.</text>

    <!-- Pillar 1 -->
    <g transform="translate(14, 94)">
      <rect x="0" y="0" width="316" height="52" rx="10" fill="#fef3c7" stroke="#fde68a"/>
      <rect x="8" y="8" width="36" height="36" rx="8" fill="#fde68a"/>
      <text x="26" y="31" font-family="sans-serif" font-size="15" font-weight="900" fill="#92400e" text-anchor="middle">₹</text>
      <text x="52" y="22" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Low-Cost Education Opportunities</text>
      <text x="52" y="36" font-family="sans-serif" font-size="8.8" font-weight="500" fill="#78350f">Dedicated institutional fee concessions &amp; transparent aid</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(14, 154)">
      <rect x="0" y="0" width="316" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
      <rect x="8" y="8" width="36" height="36" rx="8" fill="#bfdbfe"/>
      <text x="26" y="32" font-family="sans-serif" font-size="16" font-weight="900" fill="#1e40af" text-anchor="middle">🤝</text>
      <text x="52" y="22" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">SC/ST &amp; Tribal Financial Assistance</text>
      <text x="52" y="36" font-family="sans-serif" font-size="8.8" font-weight="500" fill="#1e40af">Full nodal officer guidance for SSP &amp; NSP government aid</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(14, 214)">
      <rect x="0" y="0" width="316" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
      <rect x="8" y="8" width="36" height="36" rx="8" fill="#bbf7d0"/>
      <text x="26" y="32" font-family="sans-serif" font-size="16" font-weight="900" fill="#15803d" text-anchor="middle">🏥</text>
      <text x="52" y="22" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a">Practical Clinical &amp; Placement Support</text>
      <text x="52" y="36" font-family="sans-serif" font-size="8.8" font-weight="500" fill="#15803d">Direct bedside rotations at Oxylife 50-Bed Hospital</text>
    </g>

    <!-- Inspiring Quote Banner -->
    <g transform="translate(14, 274)">
      <rect x="0" y="0" width="316" height="38" rx="8" fill="#0f172a"/>
      <text x="158" y="17" font-family="sans-serif" font-size="9" font-weight="700" font-style="italic" fill="#fbbf24" text-anchor="middle">“We don't want financial difficulties to end a student's dreams.”</text>
      <text x="158" y="30" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">Affordable education is the beginning of your success story.</text>
    </g>

    <!-- Action Button -->
    <rect x="14" y="322" width="316" height="38" rx="12" fill="url(#btnGrad2)"/>
    <text x="172" y="346" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Apply for Low-Cost Seat / Financial Aid ➔</text>
  </g>

  <!-- Programs section peek -->
  <g transform="translate(38, 580)">
    <text x="0" y="20" font-family="sans-serif" font-size="10" font-weight="800" fill="#be123c">EXPLORE COURSES</text>
    <rect x="0" y="30" width="344" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="16" y="60" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">B.Sc. Nursing • D.Pharm • B.Pharm • BPT</text>
  </g>

  <!-- Phone Home Bar -->
  <rect x="150" y="746" width="120" height="4" rx="2" fill="#94a3b8"/>
</svg>
