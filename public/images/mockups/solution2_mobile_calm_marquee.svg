<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 120" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="120" fill="#0f172a" rx="12"/>
  
  <text x="20" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.05em">SOLUTION 2: HIGH-CONTRAST CALM MARQUEE</text>

  <!-- Marquee Bar -->
  <g transform="translate(15, 38)" filter="url(#shadow2)">
    <!-- Container -->
    <rect width="360" height="48" rx="8" fill="#881337" stroke="#9f1239" stroke-width="1.5"/>
    
    <!-- Badge -->
    <rect x="10" y="13" width="94" height="22" rx="11" fill="#f59e0b"/>
    <text x="57" y="28" fill="#1c1917" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">
      ADMISSIONS 26-27
    </text>

    <!-- Marquee Text Item -->
    <text x="114" y="29" fill="#ffe4e6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="600">
      Nursing • Pharmacy • BPT • B.Ed
    </text>

    <!-- Edge Fade Overlay to simulate scrolling -->
    <rect x="300" y="0" width="60" height="48" rx="8" fill="#881337" opacity="0.85"/>
    <rect x="296" y="12" width="54" height="24" rx="12" fill="#ffffff"/>
    <text x="323" y="27.5" fill="#881337" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
      Apply ➔
    </text>
  </g>

  <text x="20" y="106" fill="#f43f5e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">
    ✓ Deep royal burgundy background + pure white text prevents sunlight glare &amp; blur
  </text>
</svg>
