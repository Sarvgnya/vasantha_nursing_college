<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780" width="100%" height="100%">
  <defs>
    <filter id="shadowD" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="btnGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="420" height="780" fill="#f1f5f9"/>

  <!-- Design Title Header -->
  <text x="210" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#be123c" text-anchor="middle" letter-spacing="1">NEW DESIGN D</text>
  <text x="210" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">Student Voice &amp; Human Story Reassurance Card</text>

  <!-- Phone Mockup Body -->
  <rect x="22" y="70" width="376" height="690" rx="36" fill="#ffffff" stroke="#1e293b" stroke-width="8" filter="url(#shadowD)"/>

  <!-- Phone Speaker Notch -->
  <rect x="150" y="74" width="120" height="16" rx="8" fill="#1e293b"/>
  <circle cx="170" cy="82" r="3" fill="#334155"/>
  <rect x="185" y="80" width="50" height="4" rx="2" fill="#334155"/>

  <!-- Top Announcement Bar -->
  <rect x="26" y="98" width="368" height="24" fill="#0f172a"/>
  <text x="38" y="114" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24">ESTD. 1984</text>
  <text x="382" y="114" font-family="sans-serif" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="end">Helpline: 9512592211</text>

  <!-- Mobile Header Navbar -->
  <rect x="26" y="122" width="368" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="145" r="14" fill="#fee2e2"/>
  <text x="50" y="150" font-family="sans-serif" font-size="13" font-weight="900" fill="#be123c" text-anchor="middle">V</text>
  <text x="72" y="141" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">VASANTHA GROUP</text>
  <text x="72" y="153" font-family="sans-serif" font-size="9" font-weight="600" fill="#be123c">Faculty of Health Sciences</text>
  <rect x="306" y="134" width="46" height="22" rx="11" fill="#be123c"/>
  <text x="329" y="149" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Apply</text>
  <text x="370" y="150" font-family="sans-serif" font-size="16" font-weight="700" fill="#334155">☰</text>

  <!-- ==================== STUDENT VOICE CARD ==================== -->
  <g transform="translate(36, 185)">
    <rect x="0" y="0" width="348" height="395" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadowD)"/>

    <!-- Student Avatar + Info Row -->
    <g transform="translate(16, 16)">
      <circle cx="28" cy="28" r="28" fill="url(#avatarGrad)" stroke="#f43f5e" stroke-width="2"/>
      <text x="28" y="34" font-family="sans-serif" font-size="24" text-anchor="middle">👩‍⚕️</text>

      <g transform="translate(68, 8)">
        <text x="0" y="14" font-family="sans-serif" font-size="12" font-weight="900" fill="#0f172a">“Financial difficulties didn't stop me.”</text>
        <text x="0" y="28" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#be123c">Kavitha M. • B.Sc. Nursing Student</text>
        <text x="0" y="40" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#64748b">SC/ST Scholarship Beneficiary, Rural Karnataka</text>
      </g>
    </g>

    <!-- Speech Bubble Container -->
    <g transform="translate(16, 82)">
      <rect x="0" y="0" width="316" height="220" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      
      <!-- Arrow pointer up -->
      <polygon points="32,-8 40,0 24,0" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      <rect x="23" y="0" width="18" height="3" fill="#fffbeb"/>

      <g transform="translate(14, 16)">
        <text x="0" y="12" font-family="sans-serif" font-size="13" font-weight="900" fill="#0f172a">Education for Everyone.</text>
        <text x="0" y="28" font-family="sans-serif" font-size="13" font-weight="900" fill="#be123c">Your Dreams Deserve a Chance.</text>

        <text x="0" y="50" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#334155">Financial difficulties should never stop a deserving</text>
        <text x="0" y="64" font-family="sans-serif" font-size="9.5" font-weight="500" fill="#334155">student from higher education. <tspan font-weight="800" fill="#0f172a">Vasantha Group</tspan> is</text>
        <text x="0" y="78" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#0f172a">committed to low-cost education and financial aid</text>
        <text x="0" y="92" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#be123c">for SC/ST communities, tribal and rural students.</text>

        <!-- Quote -->
        <g transform="translate(0, 106)">
          <rect x="0" y="0" width="288" height="42" rx="6" fill="#ffffff" stroke="#fed7aa"/>
          <text x="144" y="18" font-family="sans-serif" font-size="8.8" font-weight="700" font-style="italic" fill="#9a3412" text-anchor="middle">“We don't want financial difficulties to end your dreams.</text>
          <text x="144" y="32" font-family="sans-serif" font-size="8.8" font-weight="700" font-style="italic" fill="#9a3412" text-anchor="middle">Affordable education is the start of your success story.”</text>
        </g>
      </g>
    </g>

    <!-- 2 Quick Action Buttons -->
    <g transform="translate(16, 318)">
      <rect x="0" y="0" width="154" height="40" rx="10" fill="url(#btnGradD)"/>
      <text x="77" y="24" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">Enquire for Aid ➔</text>

      <rect x="162" y="0" width="154" height="40" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="239" y="24" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="middle">📞 Call 9512592211</text>
    </g>

    <text x="174" y="378" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="middle">Low-Cost Nursing &amp; Pharmacy Seats • Karnataka SSP Guidance</text>
  </g>

  <!-- Programs peek below -->
  <g transform="translate(36, 600)">
    <text x="0" y="16" font-family="sans-serif" font-size="11" font-weight="800" fill="#be123c">ACADEMIC DISCIPLINES (8)</text>
    <rect x="0" y="26" width="348" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="16" y="54" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">B.Sc. Nursing • D.Pharm • B.Pharm • BPT</text>
  </g>

  <!-- Phone Home Bar -->
  <rect x="150" y="746" width="120" height="4" rx="2" fill="#94a3b8"/>
</svg>
