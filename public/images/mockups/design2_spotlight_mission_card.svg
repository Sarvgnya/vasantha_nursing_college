<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="100%" height="100%">
  <defs>
    <filter id="cardShadow2" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="380" height="180" fill="#0b1329" rx="14"/>

  <text x="16" y="22" fill="#f43f5e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.05em">
    DESIGN 2: SPOTLIGHT MISSION CARD WITH CHIPS &amp; CALL
  </text>

  <!-- Card Container -->
  <g transform="translate(15, 34)" filter="url(#cardShadow2)">
    <rect width="350" height="124" rx="12" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>

    <!-- Row 1: Tag -->
    <rect x="12" y="10" width="140" height="20" rx="4" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
    <text x="82" y="23.5" fill="#b45309" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">
      ★ EQUAL OPPORTUNITY
    </text>
    <text x="336" y="24" fill="#9f1239" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="end">
      2026–27 Aid
    </text>

    <!-- Heading -->
    <text x="12" y="44" fill="#0f172a" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12.5" font-weight="800">
      Education for Everyone. <tspan fill="#be123c">Your Dreams Deserve a Chance.</tspan>
    </text>

    <!-- 2 Lines Elaboration -->
    <text x="12" y="60" fill="#475569" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="500">
      Accessible &amp; low-cost healthcare degrees with financial aid
    </text>
    <text x="12" y="73" fill="#475569" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="500">
      specifically for SC/ST communities, tribal and rural backgrounds.
    </text>

    <!-- Chips Row -->
    <rect x="12" y="82" width="72" height="16" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="48" y="93.5" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">✓ SC/ST Aid</text>

    <rect x="90" y="82" width="84" height="16" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="132" y="93.5" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">✓ Low-Cost Seats</text>

    <!-- Buttons Row -->
    <rect x="12" y="102" width="230" height="26" rx="6" fill="#be123c"/>
    <text x="127" y="119" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      Enquire for Financial Assistance ➔
    </text>

    <rect x="250" y="102" width="88" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="294" y="119" fill="#0f172a" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      📞 Call Desk
    </text>
  </g>
</svg>
