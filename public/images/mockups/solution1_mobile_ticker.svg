<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tickerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="120" fill="#0f172a" rx="12"/>
  
  <text x="20" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.05em">SOLUTION 1: STATIONARY ROTATING TICKER (0% BLUR)</text>

  <!-- Ticker Bar -->
  <g transform="translate(15, 38)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="360" height="52" rx="10" fill="url(#tickerGrad)" stroke="#fecaca" stroke-width="1.5"/>
    
    <!-- Pulsing Live Dot -->
    <circle cx="26" cy="26" r="4.5" fill="#dc2626"/>
    <circle cx="26" cy="26" r="8" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>

    <!-- Ticker Message -->
    <text x="44" y="24" fill="#7f1d1d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800">
      ADMISSIONS 2026–27:
    </text>
    <text x="44" y="38" fill="#991b1b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="600">
      Nursing, Pharmacy, BPT &amp; B.Ed
    </text>

    <!-- Pinned Action Button -->
    <rect x="278" y="12" width="70" height="28" rx="14" fill="#be123c"/>
    <text x="313" y="29.5" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      Apply ➔
    </text>
  </g>

  <text x="20" y="108" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600">
    ✓ Text is completely still, sharp &amp; easy to read on mobile • Cycles smoothly every 3.5s
  </text>
</svg>
