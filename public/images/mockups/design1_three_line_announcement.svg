<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradD1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="380" height="160" fill="#0b1329" rx="14"/>

  <text x="16" y="22" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.05em">
    DESIGN 1: 3-LINE ELABORATED BANNER (NO TEXT CUT OFF)
  </text>

  <!-- Banner Container -->
  <g transform="translate(15, 34)" filter="url(#cardShadow)">
    <rect width="350" height="92" rx="10" fill="url(#bgGradD1)" stroke="#fed7aa" stroke-width="1.5"/>

    <!-- Row 1: Badge + Apply Button -->
    <rect x="12" y="10" width="170" height="22" rx="11" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="97" y="25" fill="#92400e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">
      🌟 EDUCATION FOR EVERYONE
    </text>

    <rect x="256" y="9" width="82" height="24" rx="12" fill="#be123c"/>
    <text x="297" y="25" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">
      Apply Online ➔
    </text>

    <!-- Lines 2 & 3: Elaborated Manifesto (No truncation!) -->
    <text x="14" y="50" fill="#7f1d1d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="800">
      Your Dreams Deserve a Chance.
    </text>
    <text x="14" y="66" fill="#334155" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500">
      Financial difficulties should never stop a deserving student.
    </text>
    <text x="14" y="80" fill="#881337" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">
      Low-cost education &amp; financial aid for SC/ST, tribal &amp; rural students.
    </text>
  </g>

  <text x="16" y="146" fill="#10b981" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600">
    ✓ 100% visible • 0% ellipsis • Direct 1-tap Apply button
  </text>
</svg>
