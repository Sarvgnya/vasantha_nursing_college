<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780" width="100%" height="100%">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="barShadow" x="-5%" y="-15%" width="110%" height="130%">
      <feDropShadow dx="0" dy="-4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="btnGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="420" height="780" fill="#f1f5f9"/>

  <!-- Option Title Header -->
  <text x="210" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#be123c" text-anchor="middle" letter-spacing="1">OPTION 4</text>
  <text x="210" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">Sticky Bottom Quick-Bar (Always Visible)</text>

  <!-- Phone Mockup Body -->
  <rect x="22" y="70" width="376" height="690" rx="36" fill="#ffffff" stroke="#1e293b" stroke-width="8" filter="url(#shadow4)"/>

  <!-- Phone Speaker Notch -->
  <rect x="150" y="74" width="120" height="16" rx="8" fill="#1e293b"/>
  <circle cx="170" cy="82" r="3" fill="#334155"/>
  <rect x="185" y="80" width="50" height="4" rx="2" fill="#334155"/>

  <!-- Page Background Content (Simulating Scrolling Through Courses) -->
  <g transform="translate(38, 120)">
    <!-- Header info -->
    <rect x="0" y="0" width="344" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="14" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">Academic Programs &amp; Syllabi</text>
    <text x="14" y="42" font-family="sans-serif" font-size="10" font-weight="500" fill="#64748b">Explore our 8 health science &amp; nursing degrees</text>

    <!-- Course Card 1 -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="344" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="12" width="70" height="70" rx="10" fill="#fee2e2"/>
      <text x="47" y="52" font-family="sans-serif" font-size="16" font-weight="900" fill="#be123c" text-anchor="middle">B.Sc</text>
      <text x="94" y="28" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">B.Sc. Nursing</text>
      <text x="94" y="44" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#64748b">4 Years • 60 Seats • RGUHS</text>
      <rect x="94" y="54" width="130" height="18" rx="4" fill="#fef3c7"/>
      <text x="159" y="66" font-family="sans-serif" font-size="8" font-weight="800" fill="#92400e" text-anchor="middle">🌟 Financial Aid Eligible</text>
      <line x1="12" y1="92" x2="332" y2="92" stroke="#f1f5f9"/>
      <text x="14" y="112" font-family="sans-serif" font-size="9" font-weight="600" fill="#0f172a">Eligibility: 10+2 PCB (45% Gen / 40% SC/ST)</text>
    </g>

    <!-- Course Card 2 -->
    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="344" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="12" width="70" height="70" rx="10" fill="#eff6ff"/>
      <text x="47" y="52" font-family="sans-serif" font-size="16" font-weight="900" fill="#1e40af" text-anchor="middle">GNM</text>
      <text x="94" y="28" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">GNM Nursing</text>
      <text x="94" y="44" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#64748b">3 Years • 60 Seats • KSNC</text>
      <rect x="94" y="54" width="130" height="18" rx="4" fill="#fef3c7"/>
      <text x="159" y="66" font-family="sans-serif" font-size="8" font-weight="800" fill="#92400e" text-anchor="middle">🌟 Financial Aid Eligible</text>
      <line x1="12" y1="92" x2="332" y2="92" stroke="#f1f5f9"/>
      <text x="14" y="112" font-family="sans-serif" font-size="9" font-weight="600" fill="#0f172a">Eligibility: 10+2 Any (40% Gen / 35% SC/ST)</text>
    </g>

    <!-- Course Card 3 -->
    <g transform="translate(0, 356)">
      <rect x="0" y="0" width="344" height="130" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="12" y="12" width="70" height="70" rx="10" fill="#f0fdf4"/>
      <text x="47" y="52" font-family="sans-serif" font-size="16" font-weight="900" fill="#15803d" text-anchor="middle">D.Ph</text>
      <text x="94" y="28" font-family="sans-serif" font-size="12" font-weight="800" fill="#0f172a">D.Pharm (Pharmacy)</text>
      <text x="94" y="44" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#64748b">2 Years • 60 Seats • PCI</text>
      <rect x="94" y="54" width="130" height="18" rx="4" fill="#fef3c7"/>
      <text x="159" y="66" font-family="sans-serif" font-size="8" font-weight="800" fill="#92400e" text-anchor="middle">🌟 Financial Aid Eligible</text>
    </g>
  </g>

  <!-- ==================== STICKY BOTTOM QUICK-BAR ==================== -->
  <g transform="translate(26, 680)">
    <rect x="0" y="0" width="368" height="66" rx="0" fill="#0f172a" filter="url(#barShadow)"/>
    
    <!-- Top accent border line -->
    <rect x="0" y="0" width="368" height="2" fill="#f59e0b"/>

    <g transform="translate(14, 12)">
      <circle cx="16" cy="18" r="14" fill="#1e293b"/>
      <text x="16" y="23" font-family="sans-serif" font-size="15" text-anchor="middle">🤝</text>

      <text x="38" y="15" font-family="sans-serif" font-size="10.5" font-weight="900" fill="#fbbf24">Education for Everyone</text>
      <text x="38" y="29" font-family="sans-serif" font-size="9" font-weight="600" fill="#e2e8f0">Low-Cost Seats &amp; SC/ST Financial Aid</text>

      <!-- Action Button -->
      <rect x="238" y="2" width="102" height="34" rx="17" fill="url(#btnGrad4)"/>
      <text x="289" y="23" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">Enquire Aid ➔</text>
    </g>
  </g>

  <!-- Phone Home Bar -->
  <rect x="150" y="746" width="120" height="4" rx="2" fill="#ffffff"/>
</svg>
