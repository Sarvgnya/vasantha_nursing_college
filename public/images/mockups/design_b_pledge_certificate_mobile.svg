<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780" width="100%" height="100%">
  <defs>
    <filter id="shadowB" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fefbf2"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="btnGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="420" height="780" fill="#f1f5f9"/>

  <!-- Design Title Header -->
  <text x="210" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#be123c" text-anchor="middle" letter-spacing="1">NEW DESIGN B</text>
  <text x="210" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">Official Social Commitment Charter &amp; Seal</text>

  <!-- Phone Mockup Body -->
  <rect x="22" y="70" width="376" height="690" rx="36" fill="#ffffff" stroke="#1e293b" stroke-width="8" filter="url(#shadowB)"/>

  <!-- Phone Speaker Notch -->
  <rect x="150" y="74" width="120" height="16" rx="8" fill="#1e293b"/>
  <circle cx="170" cy="82" r="3" fill="#334155"/>
  <rect x="185" y="80" width="50" height="4" rx="2" fill="#334155"/>

  <!-- Top Announcement Bar -->
  <rect x="26" y="98" width="368" height="24" fill="#0f172a"/>
  <text x="38" y="114" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24">ESTD. 1984</text>
  <text x="382" y="114" font-family="sans-serif" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="end">Helpline: 9512592211</text>

  <!-- Mobile Header Navbar -->
  <rect x="26" y="122" width="368" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="145" r="14" fill="#fee2e2"/>
  <text x="50" y="150" font-family="sans-serif" font-size="13" font-weight="900" fill="#be123c" text-anchor="middle">V</text>
  <text x="72" y="141" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">VASANTHA GROUP</text>
  <text x="72" y="153" font-family="sans-serif" font-size="9" font-weight="600" fill="#be123c">Faculty of Health Sciences</text>
  <rect x="306" y="134" width="46" height="22" rx="11" fill="#be123c"/>
  <text x="329" y="149" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Apply</text>
  <text x="370" y="150" font-family="sans-serif" font-size="16" font-weight="700" fill="#334155">☰</text>

  <!-- ==================== OFFICIAL TRUST CHARTER CARD ==================== -->
  <g transform="translate(36, 185)">
    <!-- Certificate Paper Outer -->
    <rect x="0" y="0" width="348" height="395" rx="16" fill="url(#certBg)" stroke="url(#goldBorder)" stroke-width="2"/>
    
    <!-- Ornate Inner Border -->
    <rect x="8" y="8" width="332" height="379" rx="12" fill="none" stroke="#fde68a" stroke-width="1" stroke-dasharray="4, 3"/>

    <!-- Header Crest & Ribbon -->
    <g transform="translate(174, 32)">
      <circle cx="0" cy="0" r="18" fill="url(#goldSeal)" filter="url(#shadowB)"/>
      <text x="0" y="6" font-family="serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">⚖</text>
      <text x="0" y="28" font-family="sans-serif" font-size="8" font-weight="800" fill="#92400e" letter-spacing="1.5" text-anchor="middle">OFFICIAL INSTITUTIONAL PLEDGE</text>
    </g>

    <!-- Main Title -->
    <text x="174" y="82" font-family="serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">Education for Everyone</text>
    <text x="174" y="98" font-family="sans-serif" font-size="12" font-weight="800" fill="#be123c" text-anchor="middle">Your Dreams Deserve a Chance</text>

    <!-- Divider with decorative diamond -->
    <line x1="40" y1="108" x2="308" y2="108" stroke="#fcd34d" stroke-width="1"/>
    <polygon points="174,105 177,108 174,111 171,108" fill="#f59e0b"/>

    <!-- Charter Body Text -->
    <g transform="translate(20, 126)">
      <text x="0" y="0" font-family="sans-serif" font-size="9.8" font-weight="500" fill="#334155">Financial difficulties should never stop a deserving</text>
      <text x="0" y="14" font-family="sans-serif" font-size="9.8" font-weight="500" fill="#334155">student from pursuing higher education. <tspan font-weight="800" fill="#0f172a">Vasantha Group</tspan></text>
      <text x="0" y="28" font-family="sans-serif" font-size="9.8" font-weight="800" fill="#0f172a">of Education is committed to quality, accessible and</text>
      <text x="0" y="42" font-family="sans-serif" font-size="9.8" font-weight="800" fill="#be123c">affordable education for SC/ST communities and</text>
      <text x="0" y="56" font-family="sans-serif" font-size="9.8" font-weight="800" fill="#be123c">tribal and rural backgrounds through low-cost seats.</text>
    </g>

    <!-- Callout Quote Parchment Box -->
    <g transform="translate(18, 204)">
      <rect x="0" y="0" width="312" height="52" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="156" y="20" font-family="serif" font-size="9.5" font-weight="700" font-style="italic" fill="#9a3412" text-anchor="middle">“We don't want financial difficulties to end a student's dreams.</text>
      <text x="156" y="34" font-family="serif" font-size="9.5" font-weight="700" font-style="italic" fill="#9a3412" text-anchor="middle">Affordable education is the beginning of their success story.”</text>
      <text x="156" y="46" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#c2410c" text-anchor="middle">— VASANTHA GROUP MANAGEMENT COMMITMENT</text>
    </g>

    <!-- Seals of Assurance Row -->
    <g transform="translate(18, 268)">
      <rect x="0" y="0" width="98" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="49" y="18" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#0f172a" text-anchor="middle">LOW-COST</text>
      <text x="49" y="30" font-family="sans-serif" font-size="7" font-weight="600" fill="#15803d" text-anchor="middle">Fee Concessions</text>

      <rect x="107" y="0" width="98" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="156" y="18" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#0f172a" text-anchor="middle">SC/ST &amp; RURAL</text>
      <text x="156" y="30" font-family="sans-serif" font-size="7" font-weight="600" fill="#1e40af" text-anchor="middle">SSP/NSP Guidance</text>

      <rect x="214" y="0" width="98" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="263" y="18" font-family="sans-serif" font-size="7.5" font-weight="800" fill="#0f172a" text-anchor="middle">100% CLINICAL</text>
      <text x="263" y="30" font-family="sans-serif" font-size="7" font-weight="600" fill="#b45309" text-anchor="middle">Oxylife Hospital</text>
    </g>

    <!-- Action Button -->
    <g transform="translate(18, 322)">
      <rect x="0" y="0" width="312" height="40" rx="10" fill="url(#btnGradB)"/>
      <text x="156" y="24" font-family="sans-serif" font-size="11" font-weight="800" fill="#fbbf24" text-anchor="middle">Claim Financial Assistance &amp; Apply Online ➔</text>
    </g>

    <text x="174" y="378" font-family="sans-serif" font-size="8" font-weight="700" fill="#94a3b8" text-anchor="middle">Recognised by Govt. of Karnataka • KSNC, INC &amp; PCI Approved</text>
  </g>

  <!-- Programs peek below -->
  <g transform="translate(36, 600)">
    <text x="0" y="16" font-family="sans-serif" font-size="11" font-weight="800" fill="#be123c">EXPLORE ACADEMIC DEGREES</text>
    <rect x="0" y="26" width="348" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="16" y="54" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">B.Sc. Nursing • D.Pharm • B.Pharm • BPT</text>
  </g>

  <!-- Phone Home Bar -->
  <rect x="150" y="746" width="120" height="4" rx="2" fill="#94a3b8"/>
</svg>
