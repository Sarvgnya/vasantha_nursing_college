<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 780" width="100%" height="100%">
  <defs>
    <filter id="shadowA" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="reelGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="reelGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="reelGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="reelGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="btnGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="420" height="780" fill="#f1f5f9"/>

  <!-- Design Title Header -->
  <text x="210" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#be123c" text-anchor="middle" letter-spacing="1">NEW DESIGN A</text>
  <text x="210" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">Story Highlights / Interactive Reels Bar</text>

  <!-- Phone Mockup Body -->
  <rect x="22" y="70" width="376" height="690" rx="36" fill="#ffffff" stroke="#1e293b" stroke-width="8" filter="url(#shadowA)"/>

  <!-- Phone Speaker Notch -->
  <rect x="150" y="74" width="120" height="16" rx="8" fill="#1e293b"/>
  <circle cx="170" cy="82" r="3" fill="#334155"/>
  <rect x="185" y="80" width="50" height="4" rx="2" fill="#334155"/>

  <!-- Top Announcement Bar -->
  <rect x="26" y="98" width="368" height="24" fill="#0f172a"/>
  <text x="38" y="114" font-family="sans-serif" font-size="10" font-weight="700" fill="#fbbf24">ESTD. 1984</text>
  <text x="382" y="114" font-family="sans-serif" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="end">Helpline: 9512592211</text>

  <!-- Mobile Header Navbar -->
  <rect x="26" y="122" width="368" height="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="50" cy="145" r="14" fill="#fee2e2"/>
  <text x="50" y="150" font-family="sans-serif" font-size="13" font-weight="900" fill="#be123c" text-anchor="middle">V</text>
  <text x="72" y="141" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">VASANTHA GROUP</text>
  <text x="72" y="153" font-family="sans-serif" font-size="9" font-weight="600" fill="#be123c">Faculty of Health Sciences</text>
  <rect x="306" y="134" width="46" height="22" rx="11" fill="#be123c"/>
  <text x="329" y="149" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Apply</text>
  <text x="370" y="150" font-family="sans-serif" font-size="16" font-weight="700" fill="#334155">☰</text>

  <!-- ==================== STORY HIGHLIGHTS BAR (POPULAR YOUTH UI) ==================== -->
  <g transform="translate(34, 178)">
    <rect x="0" y="0" width="352" height="92" rx="14" fill="#fffbeb" stroke="#fef08a"/>
    <text x="12" y="16" font-family="sans-serif" font-size="9" font-weight="800" fill="#92400e" letter-spacing="0.5">🌟 TAP TO DISCOVER OUR MISSION</text>

    <!-- Story 1: Your Dreams -->
    <g transform="translate(14, 24)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="url(#reelGrad1)" stroke-width="2.5"/>
      <circle cx="28" cy="28" r="20" fill="#fef3c7"/>
      <text x="28" y="34" font-family="sans-serif" font-size="18" text-anchor="middle">✨</text>
      <text x="28" y="60" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#0f172a" text-anchor="middle">Your Dreams</text>
    </g>

    <!-- Story 2: Low-Cost Aid -->
    <g transform="translate(98, 24)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="url(#reelGrad2)" stroke-width="2.5"/>
      <circle cx="28" cy="28" r="20" fill="#eff6ff"/>
      <text x="28" y="34" font-family="sans-serif" font-size="18" text-anchor="middle">🤝</text>
      <text x="28" y="60" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#0f172a" text-anchor="middle">SC/ST Aid</text>
    </g>

    <!-- Story 3: Oxylife Hospital -->
    <g transform="translate(182, 24)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="url(#reelGrad3)" stroke-width="2.5"/>
      <circle cx="28" cy="28" r="20" fill="#ecfdf5"/>
      <text x="28" y="34" font-family="sans-serif" font-size="18" text-anchor="middle">🏥</text>
      <text x="28" y="60" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#0f172a" text-anchor="middle">Oxylife Bedside</text>
    </g>

    <!-- Story 4: Success Story -->
    <g transform="translate(266, 24)">
      <circle cx="28" cy="28" r="24" fill="none" stroke="url(#reelGrad4)" stroke-width="2.5"/>
      <circle cx="28" cy="28" r="20" fill="#fdf2f8"/>
      <text x="28" y="34" font-family="sans-serif" font-size="18" text-anchor="middle">🎓</text>
      <text x="28" y="60" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#0f172a" text-anchor="middle">Success Story</text>
    </g>
  </g>

  <!-- ==================== ACTIVE STORY POP-IN CARD ==================== -->
  <g transform="translate(34, 282)">
    <rect x="0" y="0" width="352" height="300" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadowA)"/>

    <!-- Progress bars top -->
    <rect x="16" y="10" width="76" height="3" rx="1.5" fill="#be123c"/>
    <rect x="98" y="10" width="76" height="3" rx="1.5" fill="#e2e8f0"/>
    <rect x="180" y="10" width="76" height="3" rx="1.5" fill="#e2e8f0"/>
    <rect x="262" y="10" width="76" height="3" rx="1.5" fill="#e2e8f0"/>

    <!-- Badge -->
    <rect x="16" y="24" width="136" height="18" rx="9" fill="#fef3c7"/>
    <text x="84" y="36" font-family="sans-serif" font-size="8.5" font-weight="800" fill="#92400e" text-anchor="middle">★ EDUCATION FOR EVERYONE</text>

    <!-- Title -->
    <text x="16" y="62" font-family="sans-serif" font-size="15" font-weight="900" fill="#0f172a">Your Dreams</text>
    <text x="16" y="80" font-family="sans-serif" font-size="15" font-weight="900" fill="#be123c">Deserve a Chance.</text>

    <!-- Core Message -->
    <text x="16" y="104" font-family="sans-serif" font-size="10" font-weight="500" fill="#334155">Financial difficulties should never stop a deserving</text>
    <text x="16" y="118" font-family="sans-serif" font-size="10" font-weight="500" fill="#334155">student. <tspan font-weight="800" fill="#0f172a">Vasantha Group</tspan> provides low-cost</text>
    <text x="16" y="132" font-family="sans-serif" font-size="10" font-weight="500" fill="#334155">education &amp; financial aid for students from</text>
    <text x="16" y="146" font-family="sans-serif" font-size="10" font-weight="800" fill="#0f172a">SC/ST communities and tribal &amp; rural backgrounds.</text>

    <!-- Quote Banner with Warm Glow -->
    <rect x="16" y="160" width="320" height="54" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <rect x="16" y="160" width="4" height="54" rx="2" fill="#ea580c"/>
    <text x="28" y="177" font-family="sans-serif" font-size="9.5" font-weight="700" font-style="italic" fill="#9a3412">“We don't want financial difficulties to end a</text>
    <text x="28" y="191" font-family="sans-serif" font-size="9.5" font-weight="700" font-style="italic" fill="#9a3412">student's dreams. Affordable education is the</text>
    <text x="28" y="205" font-family="sans-serif" font-size="9.5" font-weight="700" font-style="italic" fill="#9a3412">beginning of their success story.”</text>

    <!-- Action Button -->
    <rect x="16" y="228" width="320" height="40" rx="12" fill="url(#btnGradA)"/>
    <text x="176" y="252" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">Enquire for Financial Assistance ➔</text>
    
    <text x="176" y="284" font-family="sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">Swipe stories or tap next for clinical training</text>
  </g>

  <!-- Programs peek below -->
  <g transform="translate(34, 600)">
    <text x="0" y="16" font-family="sans-serif" font-size="11" font-weight="800" fill="#be123c">ACADEMIC DISCIPLINES (8 COURSES)</text>
    <rect x="0" y="26" width="352" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="16" y="54" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">B.Sc. Nursing • D.Pharm • B.Pharm • BPT</text>
  </g>

  <!-- Phone Home Bar -->
  <rect x="150" y="746" width="120" height="4" rx="2" fill="#94a3b8"/>
</svg>
